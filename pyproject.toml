[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-fall-statistics"
version = "1.0.0"
description = "Teste exato de McNemar aplicado ao programa Safe Fall (DelCastillo-Andrés et al., 2018)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "plotly>=5.0",
    "ipywidgets>=7.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter", "nbconvert", "nbformat", "python-pptx>=0.6.21", "qrcode"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
